<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Flag Party: a fast flag-picking party game you play together on your phones. Race to pick the right flag, points for being right and being first." />
    <link rel="canonical" href="https://yetanotherquiz.com/flagParty/" />
    <link rel="dns-prefetch" href="//gridgame-ttt.jgrzegrzolka.partykit.dev" />
    <link rel="preload" href="../flags/countries.json?v=__BUILD__" as="fetch" type="application/json" crossorigin />
    <title data-i18n="party.title">Yet Another Quiz: Flag Party</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=__BUILD__" />
    <link rel="stylesheet" href="../common.css?v=__BUILD__" />
    <link rel="stylesheet" href="index.css?v=__BUILD__" />
  </head>
  <body>
    <a class="lang-toggle" id="lang-toggle" href="#"></a>
    <script>
      // Sync lang paint — resolves the language before any module imports
      // start, so <html lang> and the toggle flag are both right at first
      // paint instead of after the i18n.js graph resolves. Pinned by
      // chrome.test.js.
      //
      // <html lang> is not just an a11y nicety here. Every page ships its
      // markup in English and swaps to Polish from JS, so a Polish phone
      // rendered Polish text under a declared lang="en" — and Chrome, seeing
      // content that disagrees with the declaration, offered to translate the
      // page on every single visit. bootI18n() does set lang, but only after
      // fetching i18n/pl.json, which is far too late: the prompt has already
      // been decided. Declaring the resolved language synchronously is what
      // stops it.
      (function () {
        var lang = null;
        try {
          var s = localStorage.getItem('gridgame.lang');
          if (s === 'en' || s === 'pl') lang = s;
        } catch (e) {}
        if (!lang) {
          var n = (navigator.language || '').toLowerCase().split('-')[0];
          lang = n === 'pl' ? 'pl' : 'en';
        }
        document.documentElement.lang = lang;
        document.getElementById('lang-toggle').setAttribute('data-current', lang);
      })();
    </script>
    <a class="flags-link" href="../flagsdata/" aria-label="Browse flags" title="Browse flags" data-i18n-attr="aria-label:menu.flagsData,title:menu.flagsData"><span class="flags-icon" aria-hidden="true"></span></a>
    <button
      type="button"
      class="burger"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="burger-panel"
      data-label-open="Open menu"
      data-label-close="Close menu"
      data-i18n-attr="aria-label:menu.open,data-label-open:menu.open,data-label-close:menu.close"
      onclick="
        const open = this.getAttribute('aria-expanded') === 'true';
        this.setAttribute('aria-expanded', String(!open));
        this.setAttribute('aria-label', open ? this.dataset.labelOpen : this.dataset.labelClose);
        document.getElementById('burger-panel').hidden = open;
      "
    >
      <span class="burger-bars" aria-hidden="true"></span>
    </button>
    <nav id="burger-panel" class="burger-panel" hidden>
      <ul class="menu">
        <li><a class="menu-coffee" href="https://suppi.pl/jgrzegrzolka" target="_blank" rel="noopener noreferrer" data-i18n="coffee">Buy me a coffee</a></li>
      </ul>
    </nav>

    <main class="party" id="party">
      <p class="party-status" id="party-status" hidden></p>

      <!-- Start: create or join. The column, its type scale and the join row
           are all shared with Tic-Tac-Toe's `#lobby` via common.css — the two
           start screens are one component and change together. -->
      <section class="pt-start" id="pt-start" hidden>
        <p class="start-eyebrow">
          <span class="start-rule" aria-hidden="true"></span>
          <span data-i18n="party.eyebrow">Flag Party</span>
        </p>
        <!-- One line per span, not a <br>: data-i18n sets textContent, so a
             tag inside a translated string would render as literal text. -->
        <h1 class="start-headline">
          <span data-i18n="party.headlineA">Play together,</span>
          <span data-i18n="party.headlineB">everyone on their phone.</span>
        </h1>
        <!-- The way back into a room this device is already in. Above create /
             join because when it is showing it is almost always what the player
             came here to do: they lost the page, not the game. Hidden whenever
             there is no remembered room, which is the normal case.

             One quiet line, not a second full-width pill: it states the room and
             offers the way back in, wearing the same shape as the join row at
             the foot of the column, so "you are already in one" and "join
             another" read as the same kind of action. Only `Rejoin` is
             clickable — the lead and the code are the sentence it acts on. -->
        <p class="start-resume" id="resume-room" hidden>
          <span class="start-resume-lead" data-i18n="party.resumeLead">You are in</span>
          <span class="start-resume-code" id="resume-code"></span>
          <button type="button" class="text-link start-resume-go" id="resume-go" data-i18n="party.rejoin">Rejoin</button>
        </p>
        <button type="button" class="lobby-btn primary start-cta" id="create-room" data-i18n="party.createRoom">New online game</button>
        <!-- No `maxlength` on the field, deliberately: the browser applies it
             to a paste BEFORE any script runs, so pasting an invite link into
             a maxlength="5" box leaves "https" and normalisation never sees
             the URL it was written for. wireJoinCodeField caps the value at 5
             on every input instead, which the field can't get past either. -->
        <form class="join-form" id="join-form">
          <input
            type="text"
            id="join-code"
            class="join-code"
            inputmode="text"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="code"
            data-i18n-attr="placeholder:party.codePlaceholder"
          />
          <!-- Inert until the code is 5 characters — wireJoinCodeField owns
               the disabled flag, which also gates Enter. -->
          <button type="submit" class="text-link join-go" id="join-go" data-i18n="party.join" disabled>Join</button>
        </form>
        <p class="join-error" id="join-error" hidden></p>
      </section>

      <!-- Lobby -->
      <section class="pt-lobby" id="pt-lobby" hidden>
        <p class="room-line"><span class="room-text"><strong id="room-code">-----</strong></span><button type="button" class="share-link" id="share-btn" aria-label="Invite link" data-i18n-attr="aria-label:party.share"><span class="share-icon" aria-hidden="true"></span></button></p>
        <div class="players">
          <div class="player-list" id="players"></div>
          <!-- The empty seat, at the foot of the seat list. A bot is a seat, not a
               game setting: it used to sit in the host's setup card below, where
               pressing Add changed a list in a different panel and a third field
               competed with the two settings everybody reads. Host + lobby only,
               and it disappears at MAX_SEATS instead of greying out — see
               `botSeat.js` for why each of those three is the rule. -->
          <!-- One tap, not three. "Add bot" is a LABEL here, not a button: the
               three difficulty buttons do the adding, so choosing a level and
               seating the bot are the same gesture. It replaced an Add button
               beside a native <select>, which on a phone threw a full-height OS
               wheel over the lobby and still needed a second press afterwards.

               The levels are drawn, not written: each button shows the whole
               3-step scale and fills its own place in it, so "two of three"
               reads without comparing buttons. Carrying no level words is what
               lets the row fit every language — the words live in aria-label /
               title, and a seated bot wears its own on its chip. Order follows
               BOT_SKILL_ORDER (easiest first); botSeat.test.js pins it. -->
          <div class="chip bot-seat" id="bot-seat" hidden>
            <span class="bot-seat-verb">
              <span class="bot-seat-plus" aria-hidden="true">+</span>
              <span data-i18n="party.addBot">Add bot</span>
            </span>
            <span class="bot-seat-scale" data-i18n="party.botDifficulty">difficulty:</span>
            <span class="bot-levels">
              <button type="button" class="bot-lv" data-skill="easy" aria-label="Easy" title="Easy"
                      data-i18n-attr="aria-label:party.botEasy,title:party.botEasy">
                <span class="bot-dots" aria-hidden="true"><span class="bot-dot on"></span><span class="bot-dot"></span><span class="bot-dot"></span></span>
              </button>
              <button type="button" class="bot-lv" data-skill="medium" aria-label="Medium" title="Medium"
                      data-i18n-attr="aria-label:party.botMedium,title:party.botMedium">
                <span class="bot-dots" aria-hidden="true"><span class="bot-dot on"></span><span class="bot-dot on"></span><span class="bot-dot"></span></span>
              </button>
              <button type="button" class="bot-lv" data-skill="hard" aria-label="Hard" title="Hard"
                      data-i18n-attr="aria-label:party.botHard,title:party.botHard">
                <span class="bot-dots" aria-hidden="true"><span class="bot-dot on"></span><span class="bot-dot on"></span><span class="bot-dot on"></span></span>
              </button>
            </span>
          </div>
        </div>
        <!-- Host game setup, grouped in one bordered card so the two choices read
             as a single panel rather than two look-alike segmented strips with a
             line of text wedged between them. The whole card shows to guests too
             (disabled) and hides off the lobby via `#lobby-setup`; the two inner
             fields keep their own ids because the radiogroup paint / keyboard
             logic is scoped to them.

             The card COLLAPSES, and opens closed. Expanded it is four controls
             tall — two segmented strips and two switches — which pushed the seat
             list and the start button down the screen every time, for settings
             most hosts change once and then never look at again. Closed, it is
             one line that states the whole game ("Spot · Short · 5 rounds"), so
             the lobby's three jobs — who is here, what we are playing, start —
             each get one row. That line is the card's only heading: the fields
             name themselves once they are on screen (see `.dl-fieldhead`), and a
             lobby that already carries a room code, a player list and a start
             button does not need a fourth thing shouting.

             The header is a real <button> with aria-expanded / aria-controls, and
             the panel carries `inert` while closed — a 0fr grid row hides it from
             the eye but not from the tab order, so without that a keyboard user
             would land in an invisible card and change the length blind. -->
        <div class="lobby-setup" id="lobby-setup" hidden>
          <button type="button" class="setup-head" id="setup-head" aria-expanded="false" aria-controls="setup-body">
            <!-- The first round's own artwork, in the same 20px `.dl-ic` slot the
                 radiogroup below uses — one icon component, so the summary and the
                 control it summarises can never draw the mode differently. -->
            <span class="dl-ic" id="setup-sum-ic" aria-hidden="true"></span>
            <span class="setup-sum" id="setup-sum"></span>
            <span class="setup-chev" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"></path></svg>
            </span>
          </button>
          <div class="setup-body" id="setup-body" inert>
            <div class="setup-body-clip">
              <div class="setup-fields">
                <!-- First round on top. Round 1 used to always be Flags, decided by
                     nobody; the host chooses it now, and it IS their first draft pick, so
                     the rotation skips them a cycle. A `radiogroup`, not a row of
                     `aria-pressed` toggles: exactly one applies, and the group wants
                     arrow-key roving on one tab stop. The JS owns `tabindex` and
                     `aria-checked`, and paints each segment its mode's own artwork. -->
                <div class="draft-length" id="draft-first-pick">
                  <div class="dl-fieldhead">
                    <span class="dl-group-label" data-i18n="party.firstPickLabel">First round</span>
                    <!-- The veil is one on/off switch on the field's header row (every
                         opening mode is veilable, so one toggle, not a per-button chip).
                         The site's shared switch — `.scope-toggle` + a real hidden
                         checkbox — the same control the tic-tac-toe burger and TTT-online
                         board use, so an on/off toggle reads identically everywhere. Shown
                         to guests read-only (`.is-disabled`), like the radiogroups: the
                         opening is told, not withheld. The hover-tip spells out "starts
                         covered, clears on the clock". -->
                    <label class="scope-toggle veil-toggle hover-tip" id="draft-first-pick-veil-label"
                           data-i18n-attr="data-tip:party.veilFirstPickHint"
                           data-tip="Veil the first round: the tiles start hidden and clear as the clock runs">
                      <span class="scope-toggle-text" data-i18n="party.veilFirstPick">Covered start</span>
                      <span class="scope-toggle-switch">
                        <input type="checkbox" id="draft-first-pick-veil" />
                        <span class="scope-toggle-track" aria-hidden="true"><span class="scope-toggle-thumb"></span></span>
                      </span>
                    </label>
                  </div>
                  <span class="dl-step" role="radiogroup" id="draft-first-pick-group"
                        data-i18n-attr="aria-label:party.firstPickLabel" aria-label="First round">
                    <button type="button" class="dl-pick" role="radio" data-first-pick="flags-all" aria-checked="true" tabindex="0">
                      <span class="dl-ic" aria-hidden="true"></span>
                      <span class="dl-lab" data-i18n="party.modeShort.flagsAll">Flags</span>
                    </button>
                    <button type="button" class="dl-pick" role="radio" data-first-pick="flags-weird" aria-checked="false" tabindex="-1">
                      <span class="dl-ic" aria-hidden="true"></span>
                      <span class="dl-lab" data-i18n="party.modeShort.flagsWeird">Weird</span>
                    </button>
                    <button type="button" class="dl-pick" role="radio" data-first-pick="spot-flag" aria-checked="false" tabindex="-1">
                      <span class="dl-ic" aria-hidden="true"></span>
                      <span class="dl-lab" data-i18n="party.modeShort.spotFlag">Spot</span>
                    </button>
                    <button type="button" class="dl-pick" role="radio" data-first-pick="map-outlines" aria-checked="false" tabindex="-1">
                      <span class="dl-ic" aria-hidden="true"></span>
                      <span class="dl-lab" data-i18n="party.modeShort.mapOutlines">Maps</span>
                    </button>
                  </span>
                </div>
                <!-- Length below the first round. Two sizing modes share this field: the
                     default length table (Short / Medium / Long), or "even picks" (1 / 2 /
                     3) where the game grows so every player picks the same number of
                     rounds. The "Even picks" switch on the header mirrors the first-round
                     row's veil switch, so both header rows read as label + switch. The
                     segments swap by mode; the rounds summary sits under them. -->
                <div class="draft-length" id="draft-length">
                  <div class="dl-fieldhead">
                    <!-- The label names whichever mode is active. Both spans stay
                         translated by i18n; the JS only toggles which is shown. -->
                    <span class="dl-group-label">
                      <span id="draft-length-label" data-i18n="party.gameLength">Game length</span>
                      <span id="draft-picks-label" data-i18n="party.everyonePicks" hidden>Everyone picks</span>
                    </span>
                    <label class="scope-toggle veil-toggle hover-tip" id="draft-picks-toggle-label"
                           data-i18n-attr="data-tip:party.evenPicksHint"
                           data-tip="Even picks: the game grows so every player picks the same number of rounds">
                      <span class="scope-toggle-text" data-i18n="party.evenPicks">Even picks</span>
                      <span class="scope-toggle-switch">
                        <input type="checkbox" id="draft-picks-toggle" />
                        <span class="scope-toggle-track" aria-hidden="true"><span class="scope-toggle-thumb"></span></span>
                      </span>
                    </label>
                  </div>
                  <span class="dl-step" role="radiogroup" id="draft-length-group"
                        data-i18n-attr="aria-label:party.gameLength" aria-label="Game length">
                    <button type="button" class="dl-pick" role="radio" data-length="short" aria-checked="false" tabindex="-1">
                      <span class="dl-ic" aria-hidden="true"></span>
                      <span class="dl-lab" data-i18n="party.lengthShort">Short</span>
                    </button>
                    <button type="button" class="dl-pick" role="radio" data-length="medium" aria-checked="true" tabindex="0">
                      <span class="dl-ic" aria-hidden="true"></span>
                      <span class="dl-lab" data-i18n="party.lengthMedium">Medium</span>
                    </button>
                    <button type="button" class="dl-pick" role="radio" data-length="long" aria-checked="false" tabindex="-1">
                      <span class="dl-ic" aria-hidden="true"></span>
                      <span class="dl-lab" data-i18n="party.lengthLong">Long</span>
                    </button>
                  </span>
                  <!-- The even-picks segments: 1 / 2 / 3 rounds per player. Hidden until
                       the switch is on. Numerals need no translation; the icon is N pips. -->
                  <span class="dl-step" role="radiogroup" id="draft-picks-group" hidden
                        data-i18n-attr="aria-label:party.everyonePicks" aria-label="Everyone picks">
                    <button type="button" class="dl-pick" role="radio" data-picks="1" aria-checked="false" tabindex="-1">
                      <span class="dl-ic" aria-hidden="true"></span>
                      <span class="dl-lab">1</span>
                    </button>
                    <button type="button" class="dl-pick" role="radio" data-picks="2" aria-checked="false" tabindex="-1">
                      <span class="dl-ic" aria-hidden="true"></span>
                      <span class="dl-lab">2</span>
                    </button>
                    <button type="button" class="dl-pick" role="radio" data-picks="3" aria-checked="false" tabindex="-1">
                      <span class="dl-ic" aria-hidden="true"></span>
                      <span class="dl-lab">3</span>
                    </button>
                  </span>
                  <span class="dl-hint" id="draft-length-hint"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <p class="lobby-wait" id="lobby-wait" data-i18n="party.waitingHost" hidden>Waiting for the host to start…</p>
        <!-- Start game is the host's page-primary action, so it's a real
             primary button below the settings card (not a dock item). The
             dock carries only Home. -->
        <button type="button" class="lobby-btn primary party-start-btn" id="start-game" data-i18n="party.startGame" hidden>Play</button>
      </section>

      <!-- Question (question + reveal share this) -->
      <section class="pt-question" id="pt-question" hidden>
        <!-- No pill here. It carried "Round 1/6 · Question 1/30" (a number that
             said the show is long, not where you are) and "Zosia's pick" — which
             the round card already shows, with an avatar, in the beat right
             before this question. `.question-pill` itself lives on: the pick and
             break screens below still wear it. -->
        <div class="question-timer" id="question-timer" data-mode="question" hidden>
          <div class="question-timer-track"><div class="question-timer-fill" id="question-timer-fill"></div></div>
          <div class="question-timer-label" id="question-timer-label"></div>
        </div>
        <div class="prompt" id="prompt">
          <span class="prompt-lead" id="prompt-lead"></span>
          <span class="prompt-target" id="prompt-target"></span>
        </div>
        <!-- What the chart's numbers are counted in ("medals · 2026"). A sibling
             of .prompt rather than a child, because .prompt turns into a flex ROW
             on superlative questions and this has to sit under the whole line.
             Only ever shown on a chart reveal — during the question there is no
             number on screen for it to explain. -->
        <p class="prompt-unit" id="prompt-unit" hidden></p>
        <div class="flags-grid" id="flags-grid"></div>
        <!-- "Hold to read" on a chart reveal. It lives HERE, as a sibling of the
             grid, rather than inside the chart the JS builds: the grid's
             innerHTML is replaced on every re-render, and a button destroyed
             mid-press would strand the hold with the finger still down. -->
        <div class="hold-read" id="hold-read" hidden>
          <button type="button" class="hold-btn" id="hold-btn">
            <span id="hold-btn-label" data-i18n="party.holdToRead">Hold to read</span>
          </button>
          <p class="hold-who" id="hold-who" aria-live="polite"></p>
        </div>
        <!-- A break asked for DURING a question waits for that question to end:
             the 20 s window is a shared race, and freezing while people are
             aiming at tiles lets one seat stall the room to think. The press is
             acknowledged here rather than refused — greying the control out at
             the one moment somebody reaches for it reads as broken.

             Local to the pressing device: it is a promise to you, not yet a
             thing that has happened to the room. -->
        <p class="break-queued" id="break-queued" hidden aria-live="polite"></p>
        <div class="question-foot" id="question-foot"></div>
      </section>

      <!-- Round title card: a short beat announcing the next round (2..N) before
           its first question begins -->
      <section class="pt-roundcard" id="pt-roundcard" hidden>
        <div class="roundcard">
          <span class="roundcard-count" id="roundcard-count"></span>
          <span class="roundcard-ring" aria-hidden="true">
            <svg class="roundcard-ring-svg" viewBox="0 0 80 80">
              <circle class="roundcard-ring-track" cx="40" cy="40" r="37" pathLength="100"></circle>
              <circle class="roundcard-ring-fill" id="roundcard-ring-fill" cx="40" cy="40" r="37" pathLength="100"></circle>
            </svg>
            <span class="roundcard-ic" id="roundcard-ic"></span>
          </span>
          <span class="roundcard-name" id="roundcard-name"></span>
          <span class="roundcard-pick" id="roundcard-pick" hidden></span>
        </div>
      </section>

      <!-- Draft pick: one player chooses the next round from a hand of cards -->
      <section class="pt-pick" id="pt-pick" hidden>
        <div class="question-pill" id="pick-pill"></div>
        <p class="plabel" id="pick-lead"></p>
        <div class="pick-hand" id="pick-hand"></div>
        <div class="pick-watch" id="pick-watch" hidden></div>
        <!-- The standings stay on screen while someone picks: a watcher used to
             get an avatar and nothing else for up to PICK_TIMEOUT_SECONDS. Same
             `.scoreline` rows as the break, dimmed except the picker's own. -->
        <div class="pick-board" id="pick-board" hidden></div>
      </section>

      <!-- Between-rounds break: the standings beat after each round (not the final one) -->
      <section class="pt-break" id="pt-break" hidden>
        <!-- No "After round 1 of 6" here. The round card counts the rounds in
             dots, and the break is self-evidently the beat after a round — the
             line restated position nobody had asked about. -->
        <!-- "Standings" and the bucket-pass banner share one line — the pill names
             which scoring bucket is banking right now (Correct / Speed / Only one /
             Close), riding at the right so it costs no vertical band. Empty and
             invisible between passes; aria-live so a screen reader hears each. -->
        <div class="break-head">
          <span class="plabel" id="break-standings-label"></span>
          <span class="break-pass" id="break-pass" aria-live="polite"></span>
        </div>
        <div class="break-board" id="break-board"></div>
        <!-- MVP sits UNDER the standings and fades in only once the passes have
             settled — the round's verdict after you've watched it play out. -->
        <div class="break-mvp" id="break-mvp" hidden></div>
      </section>

      <!-- The finish, beat 1: one honour per screen, read out while the result
           is still unknown. ONE section, re-keyed per beat rather than three —
           the beats are sequential and only one is ever on screen, and a subtree
           that re-renders per frame would pin any CSS animation to its first
           keyframe (see `playCeremony`). -->
      <section class="pt-honour" id="pt-honour" hidden>
        <!-- Rebuilt wholesale per beat rather than mutated. Its children carry
             CSS animations (the glyph's stamp, the avatar's two halo pulses), and
             an animation on a surviving element pins to its first keyframe and
             never plays again — so the elements have to be new each beat for the
             beat to have any motion at all. The dots below are the one thing that
             persists across beats, which is what gives the ceremony a length. -->
        <div class="honour-body" id="honour-body"></div>
        <span class="honour-dots" id="honour-dots" aria-hidden="true"></span>
      </section>

      <!-- The finish, beat 2: the winner's own screen. Deliberately the largest
           thing in the ending — three screens of mentions followed by nothing but
           a table row made the honours read as the bigger prize. -->
      <section class="pt-winner" id="pt-winner" hidden>
        <span class="winner-av" id="winner-av"></span>
        <span class="winner-name" id="winner-name"></span>
        <span class="winner-score" id="winner-score"></span>
        <span class="winner-crown" id="winner-crown"></span>
      </section>

      <!-- The finish, beat 3: the board. No heading — the winner card IS the
           heading now. `#final-sub` is filled only on a tie, where there is no
           single winner card to carry the message.

           The header and the honours strip are SIBLINGS of the scrolling list,
           never inside it: if they scrolled away the whole structure would lose
           its point (the result stays permanently visible, and an honoured seat
           keeps its mention when its row scrolls out of view). -->
      <section class="pt-final" id="pt-final" hidden>
        <p class="party-sub" id="final-sub"></p>
        <div class="final-winner" id="final-winner" hidden></div>
        <div class="final-honours" id="final-honours" hidden aria-live="polite"></div>
        <!-- One dot per awarded title, so the strip reads as a set being cycled
             rather than a line that changes on its own. Decorative: the strip
             itself is the aria-live region. -->
        <span class="final-honour-dots" id="final-honour-dots" hidden aria-hidden="true"></span>
        <div class="final-board" id="final-board"></div>
      </section>

      <!-- ONE dock for the whole show, a SIBLING of the sections rather than a
           child of any of them. That placement is the fix, not a tidy-up.
           Each screen used to carry its own copy inside its `<section>`, and the
           screen-swap animation puts a `transform` on that section — which makes
           it the containing block for `position: fixed` descendants. So on
           phones, for the ~190ms the swap class was on, the bar's `bottom: 0`
           resolved against the section instead of the viewport and it rendered
           roughly 400px up the screen before snapping down. Desktop never showed
           it, because there the dock is in-flow and a containing block is moot.

           The rule to keep: a position-fixed element must not sit inside
           anything that can be transformed. Which items show is `dockSpec.js`,
           applied by `showSection`; `data-dock` here is only the first paint,
           so the bar is stable from the very first frame. -->
      <nav class="dock" id="party-dock" data-dock="home" data-home="../"></nav>
    </main>

    <!-- The room is holding for a player who dropped. A modal rather than
         anything in the page: a pause can start during a question, a reveal or a
         pick, so it has to read the same on all three, and the top layer means it
         cannot shift the board underneath at the exact moment someone is aiming
         at a tile. Wears the site's shared dialog (`.help-dialog`, same card as
         the TTT rules and the sync wizard).

         No dismiss ×, unlike those two: this describes a room state nobody
         opened, so there is nothing to close it back to. The host's button is
         the only way out, and guests do not get one — the last line names who
         can release the room instead. -->
    <dialog class="help-dialog pause-dialog" id="pause-dialog" aria-labelledby="pause-title">
      <h2 id="pause-title" data-i18n="party.pausedTitle">Paused</h2>
      <p id="pause-body"></p>
      <p class="pause-sub" id="pause-sub" hidden></p>
      <button type="button" class="help-close" id="pause-go" data-i18n="party.playOnAnyway" hidden>Play on without waiting</button>
    </dialog>

    <!-- The room is on a BREAK somebody asked for. A different surface from the
         pause card above, and deliberately so: a drop is something that happened
         TO the room and needs explaining (who, and whose call it is to move on),
         whereas a break is something the room chose and needs exactly one
         affordance — play. So there is nothing to read here, no title, and no
         dismiss: the game greys out behind, one button sits in the middle, and a
         single line names who asked.

         Anyone may press it. A break is a room decision, not a host privilege,
         and the person who walked away from the table is the least able to press
         anything.

         A sibling of <main>, like the dock and for the same reason: it is
         position-fixed, and a fixed element inside a section would resolve its
         offsets against the screen-swap transform instead of the viewport. -->
    <div class="break-veil" id="break-veil" hidden>
      <button type="button" class="break-play" id="break-play">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <span class="sr-only" id="break-play-label" data-i18n="party.breakResume">Resume</span>
      </button>
      <span class="break-who" id="break-who"></span>
    </div>

    <script type="module">
      import { bootFlagParty } from './page.js';
      import { disableBurgerIfEmpty, wireBurgerDismiss, mountNicknameMenuItem } from '../common.js';
      import { bootI18n, wireLangToggle } from '../i18n.js';
      bootI18n('../').then((lang) => {
        wireLangToggle(lang, undefined, { softReload: true, base: '../' });
        bootFlagParty();
        disableBurgerIfEmpty(
          document.querySelector('.burger'),
          document.querySelector('#burger-panel .menu'),
        );
        wireBurgerDismiss();
        mountNicknameMenuItem({
          rootEl: document.querySelector('#burger-panel .menu'),
          profileHref: '../profile/',
        });
      });
    </script>
  </body>
</html>
