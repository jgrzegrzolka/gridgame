<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Country flag quiz: name flags from all 195+ countries. 60-second timed mode or pick a continent. Diacritic-tolerant name input. Free, no signup." />
    <link rel="canonical" href="https://yetanotherquiz.com/flagQuiz/" />
    <link rel="preload" href="../flags/countries.json?v=__BUILD__" as="fetch" type="application/json" crossorigin />
    <title data-i18n="quiz.title">Yet Another Quiz: Country Flag Quiz</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=__BUILD__" />
    <link rel="stylesheet" href="../common.css?v=__BUILD__" />
    <link rel="stylesheet" href="../flags/flagMap.css?v=__BUILD__" />
    <link rel="stylesheet" href="index.css?v=__BUILD__" />
  </head>
  <body>
    <div class="progress-bar" id="progress-bar"></div>
    <a class="lang-toggle" id="lang-toggle" href="#"></a>
    <script>
      // Sync lang paint — resolves the language before any module imports
      // start, so <html lang> and the toggle flag are both right at first
      // paint instead of after the i18n.js graph resolves. Pinned by
      // chrome.test.js.
      //
      // <html lang> is not just an a11y nicety here. Every page ships its
      // markup in English and swaps to Polish from JS, so a Polish phone
      // rendered Polish text under a declared lang="en" — and Chrome, seeing
      // content that disagrees with the declaration, offered to translate the
      // page on every single visit. bootI18n() does set lang, but only after
      // fetching i18n/pl.json, which is far too late: the prompt has already
      // been decided. Declaring the resolved language synchronously is what
      // stops it.
      (function () {
        var lang = null;
        try {
          var s = localStorage.getItem('gridgame.lang');
          if (s === 'en' || s === 'pl') lang = s;
        } catch (e) {}
        if (!lang) {
          var n = (navigator.language || '').toLowerCase().split('-')[0];
          lang = n === 'pl' ? 'pl' : 'en';
        }
        document.documentElement.lang = lang;
        document.getElementById('lang-toggle').setAttribute('data-current', lang);
      })();
    </script>
    <a class="flags-link" href="../flagsdata/" aria-label="Browse flags" title="Browse flags" data-i18n-attr="aria-label:menu.flagsData,title:menu.flagsData"><span class="flags-icon" aria-hidden="true"></span></a>
    <button
      type="button"
      class="burger"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="burger-panel"
      data-label-open="Open menu"
      data-label-close="Close menu"
      data-i18n-attr="aria-label:menu.open,data-label-open:menu.open,data-label-close:menu.close"
      onclick="
        const open = this.getAttribute('aria-expanded') === 'true';
        this.setAttribute('aria-expanded', String(!open));
        this.setAttribute('aria-label', open ? this.dataset.labelOpen : this.dataset.labelClose);
        document.getElementById('burger-panel').hidden = open;
      "
    >
      <span class="burger-bars" aria-hidden="true"></span>
    </button>
    <nav id="burger-panel" class="burger-panel" hidden>
      <ul class="menu" id="quiz-menu"></ul>
    </nav>
    <h1 class="sr-only">Country flag quiz</h1>
    <!-- Click-away surface for the round-settings tray. Sits under the tray
         and over everything else, so the first tap outside closes it instead
         of landing on a flag tile. Sibling of #game rather than a child so it
         also covers the chrome cluster. -->
    <div class="round-tray-catcher" id="round-tray-catcher" hidden></div>
    <!-- The play head: what you're playing on the left, how you're doing on
         the right. The pill is the single home of both round settings —
         it replaced the deck-icon popover, the scope label, the `60s | all`
         links and the burger's deck pills + continent list.

         It sits OUTSIDE #game so it survives the round: the burger no longer
         carries a way to change pool or mode, so a pill that disappeared
         with the play screen would leave the result screen with no way to
         set up the next round at all. `.is-finished` hides the live
         counters there, leaving just the pill.

         Contents are painted by page.js; the tray's chips likewise. -->
    <div class="play-head" id="play-head" data-clock="60s" hidden>
      <button
        type="button"
        class="round-pill"
        id="round-pill"
        aria-expanded="false"
        aria-controls="round-tray"
        aria-label="Round settings"
        data-i18n-attr="aria-label:quiz.settings.aria"
      >
        <span class="round-pill-ico" id="round-pill-ico" aria-hidden="true"></span>
        <span class="round-pill-label" id="round-pill-label"></span>
        <span class="round-pill-chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z" /></svg>
        </span>
      </button>
      <p class="play-timer">
        <span class="play-score is-zero" id="play-score">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
          <span id="play-score-value">0</span>
        </span>
        <span class="play-sep" aria-hidden="true">·</span>
        <span id="play-time">0:00.000</span>
        <span class="play-miss is-zero" id="play-miss">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          <span id="play-miss-value">0</span>
        </span>
      </p>
      <div class="round-tray" id="round-tray" hidden>
        <p class="round-tray-cap" data-i18n="quiz.settings.whichFlags">Which flags</p>
        <div class="round-tray-chips" id="round-pools"></div>
        <p class="round-tray-cap" data-i18n="quiz.settings.howLong">How long</p>
        <div class="round-tray-chips" id="round-modes"></div>
      </div>
    </div>
    <div id="game" hidden>
      <!-- Everything the open tray dims and freezes. The map section is
           re-parented out of here into #result when the round ends. -->
      <div class="play-board" id="play-board">
        <p class="country-name" id="country-name" data-i18n="quiz.loading">Loading…</p>
        <div class="choices" id="choices"></div>
        <section id="flag-map-section" hidden aria-hidden="true"></section>
      </div>
      <nav class="dock" data-dock="playAgainInline giveUp home" data-home="../"></nav>
    </div>
    <section id="result" hidden>
      <!-- Shown only when the pool fell before the clock did: the one round
           where the score can no longer tell two results apart, so the clock
           becomes the headline and the score drops to the line below. -->
      <p class="result-cleared" id="result-cleared" hidden>
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
        <span id="result-cleared-label" data-i18n="quiz.clearedAll">Cleared every flag</span>
      </p>
      <p class="final-score result-headline" id="final-score-line"><span id="final-score">0</span></p>
      <p class="result-record" id="result-record"></p>
      <section id="daily-leaderboard" class="leaderboard" hidden>
        <h2 class="leaderboard-title" id="leaderboard-title" data-i18n="quiz.leaderboard.title">Today's leaderboard</h2>
        <div id="leaderboard-body"></div>
      </section>
      <nav class="dock" data-dock="playAgain home" data-home="../"></nav>
    </section>
    <dialog id="zoom">
      <img alt="" />
      <p></p>
    </dialog>
    <script type="module">
      import { bootFlagQuiz } from './page.js';
      import { bootI18n, wireLangToggle } from '../i18n.js';
      import { wireBurgerDismiss } from '../common.js';
      // bootFlagQuiz uses t() while building the dynamic menu, so we have
      // to wait for i18n to load first. The menu also includes the lang
      // toggle, so wireLangToggle has to run after bootFlagQuiz resolves.
      // The nickname menu item is mounted inside `rebuildMenu` in page.js
      // (the menu wipes itself on every language switch — mounting it
      // here once would leak after the first rebuild).
      bootI18n('../').then((lang) => bootFlagQuiz().then(() => {
        // Soft-reload mode keeps the running game (current question,
        // timer, score) and the result screen intact across a language
        // switch. bootFlagQuiz registers a `langchanged` listener that
        // re-translates the burger menu, the in-game labels, and the
        // result strings.
        wireLangToggle(lang, undefined, { softReload: true, base: '../' });
        wireBurgerDismiss();
      }));
    </script>
  </body>
</html>
